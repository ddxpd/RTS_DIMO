<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>基地施工与塔灯预览</title>
<style>
body{margin:0;background:#24272d;color:#eee;font:16px system-ui;text-align:center}main{max-width:1000px;margin:24px auto}img{display:block;max-width:100%;max-height:78vh;margin:16px auto;border-radius:8px}button{font:inherit;padding:8px 16px;margin:4px;cursor:pointer}p{color:#bac2ce}
</style>
<main>
<h1>指挥中心 · 游戏内动画预览</h1>
<button onclick="choose('build')">建造（7秒）</button>
<button onclick="choose('scan')">塔灯向下扫描（2.4秒）</button>
<button onclick="choose('red')">红方效果</button>
<button onclick="paused=!paused;this.textContent=paused?'播放':'暂停'">暂停</button>
<img id="frame" src="build-00.png" alt="基地动画画面">
<p id="caption"></p>
</main>
<script>
let mode='build',start=performance.now(),paused=false,last=0;
const frame=document.querySelector('#frame'),caption=document.querySelector('#caption');
function path(mode,i){return mode+'-'+String(i).padStart(2,'0')+'.png'}
for(const [type,n] of [['build',36],['scan',24]])for(let i=0;i<n;i++){const img=new Image();img.src=path(type,i)}
function choose(value){mode=value;start=performance.now();last=start}
function tick(now){if(paused)start+=now-last;last=now;const t=(now-start)/1000;
if(mode==='red'){frame.src='red.png';caption.textContent='所有观察窗与塔灯随阵营变色'}
else{const build=mode==='build',duration=build?8:2.4;
const i=build?Math.min(35,Math.floor((t%duration)/7*35)):Math.floor((t%duration)*10);
const src=path(mode,i);if(!frame.src.endsWith(src))frame.src=src;
caption.textContent=build?'建造进度 '+Math.round(i/35*100)+'%':'六段塔灯依次向下扫描；窗口常亮'}
requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script>
</html>
