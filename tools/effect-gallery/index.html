<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iron Front 效果图收藏</title>
<style>
:root{color-scheme:dark;--bg:#101819;--surface:#172426;--border:#2c4348;--text:#eaf3f0;--muted:#9db3ad;--accent:#66d2c8;--accent-strong:#37a99e;--danger:#ff8080;--shadow:0 18px 45px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#101819,#142224 55%,#101a1d);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
button,input,select{font:inherit}.app{width:min(1440px,calc(100% - 40px));margin:0 auto;padding:32px 0 72px}.header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:24px}.header h1{margin:0 0 8px;font-size:clamp(26px,4vw,42px)}.header p{margin:0;color:var(--muted)}
.storage{min-width:230px;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:rgba(23,36,38,.82);text-align:right}.storage strong{display:block;font-size:22px}.storage span{display:block;margin-top:3px;color:var(--muted);font-size:13px}
.toolbar{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:auto auto 1fr auto auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--border);border-radius:14px;background:rgba(16,24,25,.95);box-shadow:0 10px 30px rgba(0,0,0,.2);backdrop-filter:blur(14px)}
.tabs{display:flex;gap:6px;padding:4px;border-radius:10px;background:#0d1516}.tab{border:0;min-width:130px;padding:9px 14px;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}.tab[aria-selected=true]{background:var(--accent-strong);color:#061112;font-weight:750}.search,.select{padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:#0d1516;color:var(--text)}.search{min-width:180px}.select{padding-right:34px}
.button,.danger{padding:10px 14px;border:1px solid var(--border);border-radius:9px;background:#0d1516;color:var(--text);cursor:pointer;white-space:nowrap}.button:hover,.danger:hover{border-color:var(--accent);color:var(--accent)}.danger{color:var(--danger)}.danger:hover{border-color:var(--danger)}
.uploader{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;margin:18px 0}.drop{display:grid;place-items:center;min-height:175px;padding:26px;border:2px dashed var(--border);border-radius:16px;background:rgba(23,36,38,.62);text-align:center;transition:.2s}.drop.drag{border-color:var(--accent);background:rgba(102,210,200,.12)}.drop .icon{display:block;width:50px;height:50px;margin:0 auto 12px;border-radius:14px;background:linear-gradient(145deg,var(--accent),#2a7c74)}.drop h2{margin:0 0 8px;font-size:21px}.drop p{margin:0;color:var(--muted)}
.actions{display:grid;gap:12px;align-content:center;padding:18px;border:1px solid var(--border);border-radius:16px;background:rgba(23,36,38,.62)}.primary{padding:13px 16px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--accent),#24857c);color:#05100f;font-weight:750;cursor:pointer}.secondary{padding:12px 16px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text);cursor:pointer}.primary:hover{filter:brightness(1.08)}.secondary:hover{border-color:var(--accent);color:var(--accent)}.note{margin:0;color:var(--muted);font-size:13px}
.status{min-height:22px;margin:-6px 0 18px;color:var(--muted);font-size:14px}.status.error{color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}.card{overflow:hidden;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}.picture{position:relative;aspect-ratio:16/9;overflow:hidden;background:#0b1112}.picture img{width:100%;height:100%;object-fit:contain;display:block}.favorite{position:absolute;top:10px;right:10px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(8,14,15,.78);color:#d9d9d9;font-size:21px;line-height:1;cursor:pointer}.favorite[aria-pressed=true]{background:rgba(234,199,91,.94);color:#221a04}
.body{padding:14px}.name{min-height:44px;margin:0 0 8px;font-size:15px;line-height:1.4;overflow-wrap:anywhere}.meta{display:grid;gap:4px;margin:0 0 12px;color:var(--muted);font-size:12px}.card-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card-actions button{padding:9px 6px;border:1px solid var(--border);border-radius:8px;background:#0d1516;color:var(--text);font-size:13px;cursor:pointer}.card-actions button:hover{border-color:var(--accent);color:var(--accent)}
.empty{display:grid;place-items:center;min-height:340px;border:1px dashed var(--border);border-radius:16px;background:rgba(23,36,38,.42);text-align:center}.empty h2{margin:0 0 8px}.empty p{margin:0;color:var(--muted)}.hidden{display:none}.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
dialog{width:min(1280px,calc(100vw - 36px));max-height:calc(100vh - 36px);padding:0;border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text)}dialog::backdrop{background:rgba(4,8,9,.82)}.modal{display:grid;grid-template-columns:minmax(0,1fr)270px;overflow:hidden}.modal-picture{min-height:320px;background:#080d0e;text-align:center}.modal-picture img{max-width:100%;max-height:calc(100vh - 36px);object-fit:contain}.info{display:grid;gap:13px;align-content:start;padding:20px;border-left:1px solid var(--border)}.info h2{margin:0;font-size:19px;line-height:1.35;overflow-wrap:anywhere}.info dl{display:grid;gap:8px;margin:0;color:var(--muted);font-size:13px}.info dt{color:var(--text)}.modal-actions{display:grid;gap:9px;margin-top:6px}
@media(max-width:980px){.app{width:calc(100% - 24px);padding-top:18px}.header{align-items:start;flex-direction:column}.storage{text-align:left}.toolbar{grid-template-columns:1fr 1fr}.tabs{grid-column:1/-1;order:-1}.search{grid-column:1/-1}.uploader{grid-template-columns:1fr}}@media(max-width:620px){.toolbar,.grid,.modal{grid-template-columns:1fr}.info{border-top:1px solid var(--border);border-left:0}}
</style>
</head>
<body>
<main class="app">
<header class="header"><div><h1>Iron Front 效果图收藏</h1><p>集中导入、预览和收藏本地生成的效果图</p></div><aside class="storage" aria-label="图库统计"><strong id="storage-count">0 张</strong><span id="storage-detail">收藏 0 张</span><span id="storage-size">浏览器本地保存</span></aside></header>
<section class="toolbar" aria-label="图库操作"><div class="tabs" role="tablist" aria-label="效果图分组"><button class="tab" id="tab-all" type="button" role="tab" aria-selected="true">全部效果图</button><button class="tab" id="tab-favorites" type="button" role="tab" aria-selected="false">中意收藏</button></div><label class="sr" for="search">搜索文件名</label><input class="search" id="search" type="search" placeholder="搜索文件名" autocomplete="off"><label class="sr" for="sort">排序方式</label><select class="select" id="sort"><option value="newest" selected>最新上传</option><option value="oldest">最早上传</option><option value="name">文件名 A→Z</option><option value="size">文件大小</option></select><button class="danger" id="clear" type="button">清空图库</button></section>
<section class="uploader" aria-label="导入效果图"><div class="drop" id="drop"><div><span class="icon" aria-hidden="true"></span><h2>拖拽效果图到这里</h2><p>支持 PNG、JPG、WebP；可一次选择多个文件或整个文件夹</p></div></div><div class="actions"><button class="primary" id="select-files" type="button">选择图片文件</button><button class="secondary" id="select-folder" type="button">选择 build/verification 文件夹</button><p class="note">图片保存在当前浏览器 IndexedDB，刷新后不会丢失。</p></div><input class="hidden" id="file-input" type="file" accept="image/png,image/jpeg,image/webp" multiple><input class="hidden" id="folder-input" type="file" accept="image/png,image/jpeg,image/webp" multiple webkitdirectory></section>
<p class="status" id="status" role="status" aria-live="polite"></p><section id="gallery" role="tabpanel" aria-labelledby="tab-all"><div class="grid" id="grid"></div><div class="empty" id="empty"><div><h2 id="empty-title">还没有效果图</h2><p id="empty-description">选择文件或拖拽 PNG / JPG / WebP 图片开始建立图库。</p></div></div></section>
</main>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="modal"><div class="modal-picture"><img id="dialog-image" alt=""></div><div class="info"><h2 id="dialog-title"></h2><dl><div><dt>尺寸</dt><dd id="dialog-dimensions"></dd></div><div><dt>大小</dt><dd id="dialog-size"></dd></div><div><dt>类型</dt><dd id="dialog-type"></dd></div><div><dt>导入时间</dt><dd id="dialog-created"></dd></div></dl><div class="modal-actions"><button class="primary" id="dialog-favorite" type="button">收藏</button><button class="secondary" id="dialog-download" type="button">下载原图</button><button class="secondary" id="dialog-close" type="button">关闭预览</button></div></div></div></dialog>
<script>
"use strict";
const DB_NAME="effect-gallery-db",STORE="images",EXTENSIONS=new Set(["png","jpg","jpeg","webp"]);
const state={images:[],tab:"all",query:"",sort:"newest",previewId:null};
const urls=new Set(),el={};
document.addEventListener("DOMContentLoaded",()=>{capture();bind();init()});

function capture(){for(const id of ["tab-all","tab-favorites","search","sort","clear","drop","select-files","select-folder","file-input","folder-input","status","grid","empty","empty-title","empty-description","storage-count","storage-detail","storage-size","dialog","dialog-image","dialog-title","dialog-dimensions","dialog-size","dialog-type","dialog-created","dialog-favorite","dialog-download","dialog-close"])el[id]=document.getElementById(id)}

function bind(){
 el["tab-all"].onclick=()=>switchTab("all");el["tab-favorites"].onclick=()=>switchTab("favorites");
 el.search.oninput=e=>{state.query=e.target.value.trim().toLowerCase();render()};el.sort.onchange=e=>{state.sort=e.target.value;render()};
 el["select-files"].onclick=()=>el["file-input"].click();el["select-folder"].onclick=()=>el["folder-input"].click();
 el["file-input"].onchange=async e=>{await importFiles([...e.target.files]);e.target.value=""};
 el["folder-input"].onchange=async e=>{await importFiles([...e.target.files]);e.target.value=""};
 for(const type of ["dragenter","dragover"]){el.drop.addEventListener(type,e=>{e.preventDefault();el.drop.classList.add("drag")})}
 for(const type of ["dragleave","drop"]){el.drop.addEventListener(type,e=>{e.preventDefault();if(type==="dragleave"&&el.drop.contains(e.relatedTarget))return;el.drop.classList.remove("drag")})}
 el.drop.addEventListener("drop",async e=>await importFiles(await droppedFiles(e.dataTransfer)));
 el.grid.onclick=gridAction;el.clear.onclick=clearGallery;
 el["dialog-favorite"].onclick=async()=>{const image=find(state.previewId);if(image){await setFavorite(image.id,!image.favorite);fillDialog(image.id)}};
 el["dialog-download"].onclick=()=>download(find(state.previewId));el["dialog-close"].onclick=closeDialog;
 el.dialog.addEventListener("cancel",e=>{e.preventDefault();closeDialog()});el.dialog.addEventListener("click",e=>{if(e.target===el.dialog)closeDialog()});
 document.addEventListener("keydown",e=>{if(e.key==="Escape"&&el.dialog.open)closeDialog()});
}

async function init(){try{const db=await openDB();state.images=await getAll(db);db.close();setStatus(state.images.length?"已载入 "+state.images.length+" 张效果图。":"图库为空，可先导入 build/verification 中的效果图。");render()}catch(error){console.error(error);setStatus("无法打开本地图片数据库："+error.message,true)}}
function openDB(){return new Promise((resolve,reject)=>{if(!("indexedDB"in window))return reject(new Error("当前浏览器不支持 IndexedDB"));const request=indexedDB.open(DB_NAME,1);request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains(STORE)){const store=db.createObjectStore(STORE,{keyPath:"id"});store.createIndex("created_at","created_at");store.createIndex("favorite","favorite")}};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||new Error("IndexedDB 打开失败"))})}
function req(request){return new Promise((resolve,reject)=>{request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||new Error("IndexedDB 操作失败"))})}
function txDone(transaction){return new Promise((resolve,reject)=>{transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error||new Error("事务失败"));transaction.onabort=()=>reject(transaction.error||new Error("事务中止"))})}
async function withStore(mode,action){const db=await openDB();try{const transaction=db.transaction(STORE,mode),result=await action(transaction.objectStore(STORE));await txDone(transaction);return result}finally{db.close()}}
function getAll(db){return req(db.transaction(STORE).objectStore(STORE).getAll())}
async function importFiles(files){files=[...files||[]];if(!files.length)return;const valid=[],rejected=[];for(const file of files)(isImage(file)?valid:rejected).push(file);const keys=new Set(state.images.map(image=>image.source_key));let imported=0,duplicates=0,failed=0;for(let i=0;i<valid.length;i++){const file=valid[i],sourceKey=file.name+":"+file.size+":"+file.lastModified;setStatus("正在导入 "+(i+1)+"/"+valid.length+"："+file.name);if(keys.has(sourceKey)){duplicates++;continue}try{const record=await makeRecord(file,sourceKey);await withStore("readwrite",store=>store.put(record));state.images.push(record);keys.add(sourceKey);imported++}catch(error){console.error("导入 "+file.name+" 失败",error);failed++}}const parts=["新增 "+imported+" 张"];if(duplicates)parts.push("跳过重复 "+duplicates+" 张");if(rejected.length)parts.push("非图片 "+rejected.length+" 个");if(failed)parts.push("失败 "+failed+" 张");setStatus(parts.join("，")+"。",failed>0);render();if(imported)switchTab("all")}
function isImage(file){const extension=file.name.split(".").pop().toLowerCase();return file.size>0&&EXTENSIONS.has(extension)&&(file.type===""||file.type.startsWith("image/"))}
async function makeRecord(file,sourceKey){const meta=await imageSize(file),thumb=await thumbnail(file,meta.width,meta.height);return{id:id(),name:file.name,file_type:file.type||"image/"+sourceKey.split(".").pop().toLowerCase(),file_size:file.size,width:meta.width,height:meta.height,created_at:Date.now(),favorite:false,source_key:sourceKey,blob:file,thumb_blob:thumb}}
function id(){return crypto.randomUUID?crypto.randomUUID():"image-"+Date.now()+"-"+Math.random().toString(16).slice(2,10)}
function imageSize(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),image=new Image();image.onload=()=>{const meta={width:image.naturalWidth,height:image.naturalHeight};URL.revokeObjectURL(url);resolve(meta)};image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("图片无法解码"))};image.src=url})}
async function thumbnail(file,width,height){if(file.size<=786432||Math.max(width,height)<=720)return file;const scale=Math.min(1,480/Math.max(width,height)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(width*scale));canvas.height=Math.max(1,Math.round(height*scale));const context=canvas.getContext("2d");if(!context)return file;const url=URL.createObjectURL(file);try{const image=await new Promise((resolve,reject)=>{const element=new Image();element.onload=()=>resolve(element);element.onerror=()=>reject(new Error("缩略图生成失败"));element.src=url});context.drawImage(image,0,0,canvas.width,canvas.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/webp",.86));return blob||file}catch(error){return file}finally{URL.revokeObjectURL(url)}}
async function droppedFiles(dataTransfer){const files=[],entries=[];for(const item of [...dataTransfer.items||[]]){const entry=item.webkitGetAsEntry?.();if(entry)entries.push(entry)}if(entries.length){for(const entry of entries)await walkEntry(entry,files)}else files.push(...[...dataTransfer.files||[]]);return files}
function walkEntry(entry,files){return new Promise(resolve=>{if(entry.isFile)return entry.file(file=>{files.push(file);resolve()},resolve);if(!entry.isDirectory)return resolve();const reader=entry.createReader(),read=()=>reader.readEntries(async batch=>{if(!batch.length)return resolve();for(const child of batch)await walkEntry(child,files);read()},resolve);read()})}
</script>
<script>
"use strict";
function switchTab(tab){state.tab=tab;const all=tab==="all";el["tab-all"].setAttribute("aria-selected",String(all));el["tab-favorites"].setAttribute("aria-selected",String(!all));render()}
function find(id){return state.images.find(image=>image.id===id)}
function filtered(){return state.images.filter(image=>(state.tab==="all"||image.favorite)&&(state.query===""||image.name.toLowerCase().includes(state.query)))}
function sorted(){const images=filtered().slice();if(state.sort==="oldest")return images.sort((a,b)=>a.created_at-b.created_at||a.name.localeCompare(b.name,"zh-CN"));if(state.sort==="name")return images.sort((a,b)=>a.name.localeCompare(b.name,"zh-CN"));if(state.sort==="size")return images.sort((a,b)=>b.file_size-a.file_size||a.created_at-b.created_at);return images.sort((a,b)=>b.created_at-a.created_at||a.name.localeCompare(b.name,"zh-CN"))}
function render(){revokeUrls();el.grid.innerHTML="";for(const image of sorted())el.grid.appendChild(card(image));updateSummary()}
function card(image){const article=document.createElement("article");article.className="card";article.dataset.id=image.id;const picture=document.createElement("div");picture.className="picture";const preview=document.createElement("img");preview.loading="lazy";preview.alt="效果图 "+image.name;preview.src=url(image.thumb_blob||image.blob);const favorite=document.createElement("button");favorite.className="favorite";favorite.type="button";favorite.dataset.action="favorite";favorite.setAttribute("aria-pressed",String(image.favorite));favorite.setAttribute("aria-label",(image.favorite?"取消收藏 ":"收藏 ")+image.name);favorite.textContent=image.favorite?"★":"☆";picture.append(preview,favorite);const body=document.createElement("div");body.className="body";const name=document.createElement("h2");name.className="name";name.textContent=image.name;const meta=document.createElement("div");meta.className="meta";meta.append(text(image.width+" × "+image.height),text(bytes(image.file_size)),text(dateTime(image.created_at)));const actions=document.createElement("div");actions.className="card-actions";for(const[action,label]of[["preview","预览"],["download","下载"],["delete","删除"]]){const button=document.createElement("button");button.type="button";button.dataset.action=action;button.textContent=label;button.setAttribute("aria-label",label+" "+image.name);actions.appendChild(button)}body.append(name,meta,actions);article.append(picture,body);return article}
function text(value){const element=document.createElement("span");element.textContent=value;return element}
async function gridAction(event){const button=event.target.closest("button[data-action]");if(!button)return;const article=button.closest(".card"),image=find(article?.dataset.id);if(!image)return;if(button.dataset.action==="favorite")await setFavorite(image.id,!image.favorite);else if(button.dataset.action==="preview")openDialog(image.id);else if(button.dataset.action==="download")download(image);else if(button.dataset.action==="delete")await remove(image)}
async function setFavorite(id,favorite){const image=find(id);if(!image)return;image.favorite=favorite;await withStore("readwrite",store=>store.put(image));render()}
async function remove(image){if(!confirm("删除“"+image.name+"”？此操作无法撤销。"))return;await withStore("readwrite",store=>store.delete(image.id));state.images=state.images.filter(item=>item.id!==image.id);if(state.previewId===image.id)closeDialog();setStatus("已删除 "+image.name+"。");render()}
async function clearGallery(){if(!state.images.length)return setStatus("图库已经是空的。");if(!confirm("确定清空全部 "+state.images.length+" 张效果图和收藏状态吗？此操作无法撤销。"))return;await withStore("readwrite",store=>store.clear());state.images=[];closeDialog();setStatus("图库已清空。");render()}
function openDialog(id){state.previewId=id;fillDialog(id);if(!el.dialog.open)el.dialog.showModal();el["dialog-close"].focus()}
function fillDialog(id){const image=find(id);if(!image)return;el["dialog-image"].src=url(image.blob);el["dialog-image"].alt="效果图 "+image.name;el["dialog-title"].textContent=image.name;el["dialog-dimensions"].textContent=image.width+" × "+image.height;el["dialog-size"].textContent=bytes(image.file_size);el["dialog-type"].textContent=image.file_type;el["dialog-created"].textContent=dateTime(image.created_at);el["dialog-favorite"].textContent=image.favorite?"取消收藏":"收藏"}
function closeDialog(){if(!el.dialog.open)return;state.previewId=null;el.dialog.close()}
function download(image){if(!image)return;const href=url(image.blob),anchor=document.createElement("a");anchor.href=href;anchor.download=image.name;document.body.appendChild(anchor);anchor.click();anchor.remove()}
function url(blob){const value=URL.createObjectURL(blob);urls.add(value);return value}
function revokeUrls(){for(const value of urls)URL.revokeObjectURL(value);urls.clear()}
async function updateSummary(){const favorites=state.images.filter(image=>image.favorite).length,visible=sorted().length;el["storage-count"].textContent=state.images.length+" 张";el["storage-detail"].textContent="收藏 "+favorites+" 张";el["tab-favorites"].textContent="中意收藏 "+favorites;el.clear.disabled=!state.images.length;if(navigator.storage?.estimate){try{const estimate=await navigator.storage.estimate();if(typeof estimate.usage==="number")el["storage-size"].textContent="本地占用约 "+bytes(estimate.usage)}catch{}}if(state.tab==="favorites"){el["empty-title"].textContent=state.query?"没有匹配的收藏效果图":"还没有收藏效果图";el["empty-description"].textContent=state.query?"调整搜索词或查看全部效果图。":"在全部效果图中点击星标，图片会保存到这个标签。"}else{el["empty-title"].textContent=state.query?"没有匹配的效果图":"还没有效果图";el["empty-description"].textContent=state.query?"调整搜索词或导入更多图片。":"选择文件或拖拽 PNG / JPG / WebP 图片开始建立图库。"}el.empty.style.display=visible?"none":"grid"}
function setStatus(message,error=false){el.status.textContent=message;el.status.classList.toggle("error",error)}
function bytes(value){if(!Number.isFinite(value)||value<=0)return"0 B";const units=["B","KB","MB","GB"];let size=value,index=0;while(size>=1024&&index<units.length-1){size/=1024;index++}return(size>=10||index===0?Math.round(size):size.toFixed(1))+" "+units[index]}
function dateTime(value){return new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(value))}
window.addEventListener("beforeunload",revokeUrls);
</script>
</body>
</html>
